<!DOCTYPE html>
<html lang="es">

<meta charset="utf-8">

<style>
  :root { --bg:#f6f3ee; --card:#fff; --ink:#222; --muted:#777; --accent:#7a3b2e; --ok:#2e7d4f; --bad:#b3372f; --line:#ddd6cb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17151a; --card:#221f27; --ink:#eee; --muted:#9a95a3; --accent:#d98f7c; --ok:#5fc08a; --bad:#e8776f; --line:#38333f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia, 'Times New Roman', serif; background:var(--bg); color:var(--ink); display:flex; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:520px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:.95rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .modes { display:grid; gap:10px; margin-top:12px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:12px 14px; text-align:left; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { cursor:default; }
  .primary { background:var(--accent); color:#fff; border-color:var(--accent); text-align:center; }
  .top { display:flex; justify-content:space-between; color:var(--muted); font-size:.9rem; margin-bottom:14px; }
  .player { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .player .primary { width:64px; height:64px; border-radius:50%; font-size:1.4rem; padding:0; }
  .bar { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); }
  .opts { display:grid; gap:10px; }
  .opts small { color:var(--muted); }
  .opts button.ok { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 18%, var(--card)); }
  .opts button.bad { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 18%, var(--card)); }
  .reveal { margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-size:.95rem; line-height:1.5; }
  .reveal .primary { width:100%; margin-top:12px; }
  .msg { color:var(--bad); font-size:.9rem; margin:0 0 10px; }
  .big { font-size:2.4rem; text-align:center; margin:8px 0; }
  .rango { display:flex; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .rango label { display:flex; align-items:center; gap:6px; font-size:.95rem; }
  select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
  button:disabled { opacity:.5; }
  .link { border:0; background:none; padding:0 0 12px; color:var(--muted); font-size:.9rem; }
  .link:hover:not(:disabled) { color:var(--accent); }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Adivina la música</h1>
  <p class="sub">Escucha el fragmento y adivina. Audio de Wikimedia Commons.</p>

  <section id="menu" class="card">
    <strong>Elige un modo de juego</strong>
    <div class="rango">
      <label>Desde <select id="desde"></select></label>
      <label>Hasta <select id="hasta"></select></label>
    </div>
    <p id="avisoRango" class="sub" style="margin:6px 0 0"></p>
    <p id="estado" class="sub" style="margin:6px 0 0"></p>
    <div class="modes">
      <button data-mode="periodo">🎼 Adivinar el periodo / estilo<br><small>Elige entre los periodos del rango</small></button>
      <button data-mode="compositor">👤 Adivinar el compositor<br><small>Una correcta entre cuatro</small></button>
      <button data-mode="obra">🎵 Adivinar la obra exacta<br><small>Una correcta entre cuatro</small></button>
    </div>
  </section>

  <section id="game" class="card hidden">
    <button id="back" class="link">← Volver</button>
    <div class="top"><span id="progress"></span><span id="score"></span></div>
    <div class="player">
      <button class="primary" id="play" aria-label="Reproducir">▶</button>
      <div class="bar"><i id="fill"></i></div>
    </div>
    <p class="msg hidden" id="err"></p>
    <div class="opts" id="opts"></div>
    <div class="reveal hidden" id="reveal"></div>
  </section>

  <section id="end" class="card hidden">
    <div class="big" id="final"></div>
    <p id="finalTxt" style="text-align:center"></p>
    <button class="primary" id="again" style="width:100%">Jugar de nuevo</button>
  </section>
</main>

// JSON de la API: primero fetch; si el navegador lo bloquea, reintenta con JSONP (etiqueta <script>)
function jsonp(url) {
  return new Promise((res, rej) => {
    const cb = "cb" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const fin = () => { s.remove(); delete window[cb]; };
    window[cb] = d => { fin(); res(d); };
    s.onerror = () => { fin(); rej(new Error("Failed to fetch")); };
    s.src = url.replace("&origin=*", "") + "&callback=" + cb;
    document.head.appendChild(s);
    setTimeout(() => { if (window[cb]) { fin(); rej(new Error("Failed to fetch")); } }, 8000);
  });
}
async function getJSON(url) {
  try { return await (await fetch(url)).json(); }
  catch { return await jsonp(url); }
}

// MD5 (para calcular la ruta directa en upload.wikimedia.org)
function md5(s){
 const b=new TextEncoder().encode(s);
 const K=[],S=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
 for(let i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)>>>0;
 const n=b.length,len=(((n+8)>>6)+1)<<4,w=new Uint32Array(len);
 for(let i=0;i<n;i++)w[i>>2]|=b[i]<<((i%4)*8);
 w[n>>2]|=0x80<<((n%4)*8);w[len-2]=(n*8)>>>0;w[len-1]=Math.floor(n*8/4294967296);
 let a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;
 for(let o=0;o<len;o+=16){let A=a0,B=b0,C=c0,D=d0;
  for(let i=0;i<64;i++){let F,g;
   if(i<16){F=(B&C)|(~B&D);g=i}else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16}else if(i<48){F=B^C^D;g=(3*i+5)%16}else{F=C^(B|~D);g=(7*i)%16}
   F=(F+A+K[i]+w[o+g])>>>0;A=D;D=C;C=B;const sh=S[(i>>4)*4+(i%4)];B=(B+((F<<sh)|(F>>>(32-sh))))>>>0;}
  a0=(a0+A)>>>0;b0=(b0+B)>>>0;c0=(c0+C)>>>0;d0=(d0+D)>>>0;}
 const hex=v=>[0,8,16,24].map(x=>((v>>>x)&255).toString(16).padStart(2,'0')).join('');
 return hex(a0)+hex(b0)+hex(c0)+hex(d0);}

// Intentos de carga por orden: ruta directa (sin API ni redirección) y Special:FilePath
function candidatas(nombre) {
  const n = nombre.replace(/ /g, "_"), h = md5(n);
  return [`https://upload.wikimedia.org/wikipedia/commons/${h[0]}/${h.slice(0,2)}/${encodeURIComponent(n)}`, FP + encodeURIComponent(n)];
}
function probar() {
  const u = (state.cands || []).shift();
  if (!u) return false;
  audio.src = u; return true;
}

async function buscar(w) {
  const url = `${API}?action=query&list=search&srnamespace=6&srlimit=15&format=json&origin=*&srsearch=${encodeURIComponent(w.q + " filetype:audio")}`;
  const d = await getJSON(url);
  const hit = (d.query?.search || []).map(s => s.title).find(t => AUDIO_EXT.test(t) && w.must.test(t));
  return hit ? hit.replace(/^File:/, "") : null;
}

  const u = `${API}?action=query&list=categorymembers&cmtitle=${encodeURIComponent("Category:" + cat)}&cmtype=${encodeURIComponent("file|subcat")}&cmlimit=100&format=json&origin=*`;
  return (await getJSON(u)).query?.categorymembers || [];
};
function limpiar(nombre, t) {
  const partes = nombre.replace(AUDIO_EXT, "").replace(/_/g, " ").split(/\s[-–]\s/).map(x => x.trim()).filter(Boolean);
  if (partes.length > 1 && t.ap.test(partes[0]) && partes[0].length < 40) partes.shift();
  return partes.join(" — ") || nombre;
}

  const out = [];
  await Promise.allSettled(TABLA.filter(t => rango.includes(t.p)).map(async t => {
    if (!AUTO[t.cat]) {
      const m = await miembros("Audio files of music by " + t.cat);
      let nombres = m.filter(x => x.ns === 6).map(x => x.title);
      const subs = shuffle(m.filter(x => x.ns === 14)).slice(0, 3);
      const extra = await Promise.allSettled(subs.map(x => miembros(x.title.replace(/^Category:/, ""))));
      extra.forEach(r => { if (r.status === "fulfilled") nombres.push(...r.value.filter(x => x.ns === 6).map(x => x.title)); });
      nombres = [...new Set(nombres.map(n => n.replace(/^File:/, "")))].filter(n => AUDIO_EXT.test(n) && !MALOS.test(n));
      AUTO[t.cat] = nombres;
    }
    shuffle(AUTO[t.cat]).slice(0, 4).forEach(n => out.push({ c:t.c, p:t.p, obra:limpiar(n, t), file:n, auto:true }));
  }));
  return out;
}

// Arma las rondas: en periodo se equilibra por periodo; en los demás, al azar
function armarCola(pool, mode, rango) {
  if (mode !== "periodo") return shuffle(pool).slice(0, RONDAS);
  const n = Math.ceil(RONDAS / rango.length);
  const por = per => shuffle(pool.filter(o => o.p === per)).slice(0, n);
  return shuffle(rango.flatMap(por)).slice(0, RONDAS);
}

function rango() {
  return PERIODOS.slice(+$("desde").value, +$("hasta").value + 1);
}

async function start(mode) {
  const r = rango();
  if (mode === "periodo" && r.length < 2) return;
  const est = $("estado"); est.textContent = "Cargando catálogo…";
  let pool = OBRAS.filter(o => r.includes(o.p)), aviso = "";
  try {
    await getJSON(`${API}?action=query&meta=siteinfo&format=json&origin=*`);
    // El modo obra usa solo la lista curada (títulos limpios); los demás suman el catálogo automático
    if (mode !== "obra") {
      const auto = await cargarAuto(r);
      const usados = new Set(OBRAS.flatMap(o => [o.file, o.url]).filter(Boolean));
      pool = [...pool, ...auto.filter(o => !usados.has(o.file))];
    }
  } catch {
    pool = pool.filter(o => o.file || o.url);
    aviso = `La API de Commons está bloqueada en tu navegador, así que se juega solo con ${pool.length} obras de nombre verificado.`;
  }
  est.textContent = "";
  if (!pool.length) { est.textContent = "No hay obras disponibles en ese rango de periodos."; return; }
  const compPool = [...new Set([...OBRAS, ...TABLA].filter(o => r.includes(o.p)).map(o => o.c))];
  state = { mode, rango:r, compPool, queue: armarCola(pool, mode, r), i:0, score:0, answered:false, current:null, triedSearch:false };
  $("titulo").textContent = TITULOS[mode];
  $("menu").classList.add("hidden"); $("end").classList.add("hidden"); $("game").classList.remove("hidden");
  ronda();
  if (aviso) { $("err").textContent = aviso; $("err").classList.remove("hidden"); }
}

function opcionesPara(w) {
  if (state.mode === "periodo") {
    const r = state.rango;
    let ops;
    if (r.length >= 4) {
      ops = [w.p, ...shuffle(r.filter(p => p !== w.p)).slice(0, 3)];
    } else {
      // Rango corto: se completan 4 opciones con los periodos vecinos (nunca son la respuesta)
      const i0 = PERIODOS.indexOf(r[0]), i1 = PERIODOS.indexOf(r[r.length - 1]);
      const dist = p => { const i = PERIODOS.indexOf(p); return i < i0 ? i0 - i : i - i1; };
      const fuera = PERIODOS.filter(p => !r.includes(p)).sort((a, b) => dist(a) - dist(b));
      ops = [...r, ...fuera.slice(0, 4 - r.length)];
    }
    return { correcta: w.p, opciones: ops.sort((a, b) => PERIODOS.indexOf(a) - PERIODOS.indexOf(b)) };
  }
  if (state.mode === "compositor") {
    const dentro = state.compPool.filter(c => c !== w.c);
    const resto = COMPOSITORES.filter(c => c !== w.c && !dentro.includes(c));
    const d = [...shuffle(dentro), ...shuffle(resto)].slice(0, 3);
    return { correcta: w.c, opciones: shuffle([w.c, ...d]) };
  }
  const base = OBRAS.filter(o => o.obra !== w.obra);
  const dentro = base.filter(o => state.rango.includes(o.p)), fuera = base.filter(o => !state.rango.includes(o.p));
  const d = [...shuffle(dentro), ...shuffle(fuera)].slice(0, 3).map(o => o.obra);
  return { correcta: w.obra, opciones: shuffle([w.obra, ...d]) };
}

async function ronda() {
  const w = state.queue[state.i];
  state.current = w; state.answered = false; state.triedSearch = false;
  audio.pause(); $("fill").style.width = "0"; $("play").textContent = "▶";
  $("err").classList.add("hidden"); $("reveal").classList.add("hidden");
  $("progress").textContent = `Obra ${state.i+1} de ${state.queue.length}`;
  $("score").textContent = `Puntos: ${state.score}`;

  const { correcta, opciones } = opcionesPara(w);

  $("opts").innerHTML = "";
  opciones.forEach(o => {
    const b = document.createElement("button");
    b.dataset.valor = o;
    b.textContent = o;
    if (state.mode === "obra") {
      // En el modo obra, cada alternativa muestra también su compositor
      const comp = OBRAS.find(x => x.obra === o)?.c;
      if (comp) {
        const sm = document.createElement("small");
        sm.textContent = comp;
        b.append(document.createElement("br"), sm);
      }
    }
    b.onclick = () => responder(b, o, correcta);
    $("opts").appendChild(b);
  });

  if (w.file) {
    state.cands = candidatas(w.file);
    probar();
  } else if (w.url) {
    state.cands = [w.url];
    probar();
  } else {
    await cargarPorBusqueda(w);
  }
}

async function cargarPorBusqueda(w) {
  state.triedSearch = true;
  try {
    const nombre = await buscar(w);
    if (!nombre) throw new Error("la búsqueda en Commons no devolvió un archivo válido");
    if (state.current !== w) return;
    state.cands = candidatas(nombre);
    probar();
  } catch (e) {
    if (/no devolvió/.test(e.message) && state.current === w) {
      // Sin archivo fiable en Commons: se omite la obra para no mostrar un título dudoso
      state.queue.splice(state.i, 1);
      if (state.i >= state.queue.length) return fin();
      return ronda();
    }
    falloAudio(e.message === "Failed to fetch" ? "la API de Commons está bloqueada (¿Shields?)" : e.message);
  }
}

function saltarActual() {
  state.queue.splice(state.i, 1);
  if (state.i >= state.queue.length) return state.queue.length ? fin() : falloAudio("no hay obras disponibles");
  ronda();
}

function falloAudio(motivo) {
  const codigos = { 1:"carga abortada", 2:"error de red / bloqueado", 3:"error al decodificar", 4:"formato o URL no válidos" };
  const e = audio.error ? `${codigos[audio.error.code] || audio.error.code}` : (motivo || "sin detalle");
  $("err").textContent = `No se pudo cargar el audio (${e}). URL: ${audio.currentSrc || audio.src || "ninguna"}`;
  $("err").classList.remove("hidden");
  if (!$("skip")) {
    const s = document.createElement("button"); s.id = "skip"; s.textContent = "Saltar obra →";
    s.onclick = () => { state.queue.splice(state.i, 1); state.i--; siguiente(); };
    $("err").after(s);
  }
}

audio.addEventListener("error", () => {
  if (!audio.getAttribute("src")) return;
  if (probar()) return;
  const w = state.current;
  if (w && (w.auto || w.sinBusqueda)) return saltarActual(); // obra del catálogo automático sin audio: se omite
  if (!state.triedSearch && w) cargarPorBusqueda(w); else falloAudio();
});
audio.addEventListener("loadedmetadata", () => { const sk = $("skip"); if (sk) sk.remove(); $("err").classList.add("hidden"); });
audio.addEventListener("timeupdate", () => {
  const t = audio.currentTime;
  $("fill").style.width = Math.min(100, t / CLIP * 100) + "%";
  if (t >= CLIP) { audio.pause(); $("play").textContent = "↺"; }
});
audio.addEventListener("ended", () => $("play").textContent = "↺");

$("play").onclick = () => {
  if (!audio.paused) { audio.pause(); $("play").textContent = "▶"; return; }
  if (audio.currentTime >= CLIP || audio.ended) audio.currentTime = 0;
  audio.play().then(() => $("play").textContent = "❚❚").catch(() => {});
};

function responder(btn, elegida, correcta) {
  if (state.answered) return;
  state.answered = true;
  const w = state.current;
  const ok = elegida === correcta;
  if (ok) state.score++;
  [...$("opts").children].forEach(b => {
    b.disabled = true;
    if (b.dataset.valor === correcta) b.classList.add("ok");
  });
  if (!ok) btn.classList.add("bad");
  $("score").textContent = `Puntos: ${state.score}`;
  $("reveal").innerHTML = `${ok ? "✅ ¡Correcto!" : "❌ Incorrecto."}<br><strong>${w.c}</strong> — ${w.obra}<br><em>Periodo: ${w.p}</em>
    <button class="primary" id="next">${state.i + 1 < state.queue.length ? "Siguiente →" : "Ver resultado"}</button>`;
  $("reveal").classList.remove("hidden");
  $("next").onclick = siguiente;
}

function siguiente() {
  audio.pause();
  const sk = $("skip"); if (sk) sk.remove();
  state.i++;
  if (state.i >= state.queue.length) return fin();
  ronda();
}

function fin() {
  $("game").classList.add("hidden"); $("end").classList.remove("hidden");
  const n = state.queue.length;
  $("final").textContent = `${state.score} / ${n}`;
  $("finalTxt").textContent = state.score / n > .8 ? "¡Oído de concertino!" : state.score / n > .5 ? "Muy buen oído." : "A seguir escuchando.";
}

PERIODOS.forEach((p, i) => {
  $("desde").add(new Option(p, i)); $("hasta").add(new Option(p, i));
});
$("desde").value = 1; $("hasta").value = 3; // por defecto: Barroco → Clásico
function actualizarMenu() {
  const r = rango(), ok = r.length >= 2;
  document.querySelector('[data-mode="periodo"]').disabled = !ok;
  $("avisoRango").textContent = ok
    ? `Rango: ${r[0]} → ${r[r.length - 1]} (${r.length} periodos)`
    : "Para adivinar el periodo/estilo elige al menos 2 periodos distintos.";
}
$("desde").onchange = () => { if (+$("hasta").value < +$("desde").value) $("hasta").value = $("desde").value; actualizarMenu(); };
$("hasta").onchange = () => { if (+$("desde").value > +$("hasta").value) $("desde").value = $("hasta").value; actualizarMenu(); };
actualizarMenu();
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => start(b.dataset.mode));
$("back").onclick = () => {
  // Sale de la partida a mitad de camino y vuelve al menú
  audio.pause(); audio.removeAttribute("src");
  state.current = null; state.cands = [];
  const sk = $("skip"); if (sk) sk.remove();
  $("err").classList.add("hidden");
  $("titulo").textContent = TITULO_MENU;
  $("game").classList.add("hidden"); $("end").classList.add("hidden"); $("menu").classList.remove("hidden");
};
$("again").onclick = () => { $("titulo").textContent = TITULO_MENU; $("end").classList.add("hidden"); $("menu").classList.remove("hidden"); };
</script>
</body>
</html>
